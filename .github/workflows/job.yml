name: Job Checker

on:
  workflow_dispatch:

jobs:
  run-job-checker:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリ導入
        run: |
          pip install -r requirements.txt

      # ★Playwrightブラウザ導入
      - name: Playwright install
        run: |
          playwright install --with-deps

      - name: Python実行
        run: |
          python main.py
